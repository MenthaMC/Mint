name: Build Pull Request

on:
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    environment: default

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup java
        uses: useblacksmith/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"

      - name: ApplyAllPatches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Create CreateJar
        run: ./gradlew createMojmapPaperclipJar --stacktrace --no-daemon

      - name: Rename Paperclip JARs
        run: |
          mv mint-server/build/libs/mint-paperclip-${{ env.MC_VERSION }}-R0.1-SNAPSHOT-mojmap.jar ./mint-${{ env.MC_VERSION }}.jar
          
      - name: Upload Mint as build artifact
        uses: actions/upload-artifact@v7
        with:
          path: ./mint-${{ env.MC_VERSION }}.jar
