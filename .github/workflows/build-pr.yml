name: Build Pull Request

on:
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    environment: default

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup java
        uses: useblacksmith/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"

      - name: ApplyAllPatches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Create CreateJar
        run: ./gradlew createMojmapPaperclipJar --stacktrace --no-daemon

      - name : SetENV
        run: sh scripts/SetENV.sh
          
      - name: Rename Paperclip JARs
        uses: actions/upload-artifact@v7
        with:
          path: mint-server/build/libs/mint-${{ env.mcversion }}.jar
  event_file:
    name: "Event File"
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Event File
          path: ${{ github.event_path }}
